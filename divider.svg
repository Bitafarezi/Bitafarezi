<svg width="1000" height="50" viewBox="0 0 1000 50" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="50" fill="#000000" />
  <g>
    <circle cx="100" cy="20" r="1" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="40" r="0.8" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="15" r="1.2" fill="#00FF00">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="35" r="0.5" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="10" r="1" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="45" r="0.5" fill="white" opacity="0.3" />
    <circle cx="850" cy="5" r="0.7" fill="white" opacity="0.4" />
  </g>
  <line x1="0" y1="25" x2="1000" y2="25" stroke="#00FF00" stroke-width="0.5" stroke-opacity="0.3" />
</svg>
