<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Use standard monospace fonts for GitHub compatibility */
      .terminal-font { font-family: 'Courier New', Courier, monospace; }
      .matrix-green { fill: #00FF00; filter: drop-shadow(0 0 5px #00FF00); }
      .dim-green { fill: #003300; }
      
      @keyframes scanline {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(400px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FF00" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Side HUD Elements -->
  <g class="dim-green">
    <text x="20" y="30" class="terminal-font" font-size="12">SYS_ANALYSIS: RUNNING</text>
    <text x="20" y="55" class="terminal-font" font-size="12">KERNEL_V: 5.15.0-BITA</text>
    <text x="20" y="80" class="terminal-font" font-size="12">UPLINK: STABLE</text>
    
    <text x="820" y="30" class="terminal-font" font-size="12">LATENCY: 12ms</text>
    <text x="820" y="55" class="terminal-font" font-size="12">PACKETS: 100%</text>
    <text x="820" y="80" class="terminal-font" font-size="12">LOC: 0xDEADBEEF</text>
  </g>

  <!-- Central HUD Console -->
  <g transform="translate(500, 200)">
    <!-- Rotating Outer Rings -->
    <circle r="180" fill="none" stroke="#00FF00" stroke-width="1" stroke-dasharray="10,20" stroke-opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle r="160" fill="none" stroke="#00FF00" stroke-width="2" stroke-dasharray="50,10" stroke-opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
    </circle>

    <!-- Main Title Box -->
    <g style="animation: glitch 0.3s infinite alternate-reverse" opacity="0.9">
      <rect x="-250" y="-60" width="500" height="120" fill="none" stroke="#00FF00" stroke-width="2" />
      <rect x="-245" y="-55" width="490" height="110" fill="none" stroke="#00FF00" stroke-width="1" stroke-opacity="0.3" />
      
      <text x="0" y="-10" text-anchor="middle" class="terminal-font matrix-green" font-size="40" font-weight="bold">BITA // ROOT_ACCESS</text>
      <text x="0" y="35" text-anchor="middle" class="terminal-font matrix-green" font-size="16" letter-spacing="4">FULL STACK INFILTRATOR</text>
    </g>

    <!-- Scanning Radar Line -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#00FF00" stroke-width="1" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Animated Data Streams (Bottom) -->
  <g class="dim-green" font-size="10">
    <text x="10" y="375" class="terminal-font">01010111 01100101 01101100 01100011 01101111 01101101 01100101 00100000 01110100 01101111 00100000 01110100 01101000 01100101 00100000 01100111 01110010 01101001 01100100</text>
    <text x="10" y="395" class="terminal-font">DECRYPTING... [####################] 100% COMPLETE</text>
  </g>

  <!-- Global Scanline -->
  <rect width="1000" height="2" fill="#00FF00" opacity="0.1">
    <animate attributeName="y" from="-10" to="410" dur="3s" repeatCount="indefinite" />
  </rect>

</svg>
